<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>objtest</title>
  </head>
  <body>
    <div id="app"></div>
    <a id="logo-link" href="https://www.burtonartgallery.co.uk/" target="_blank" rel="noopener noreferrer">
      <img id="logo" src="/logo.webp" alt="The Burton at Bideford" />
    </a>
    <div id="loading-indicator">Loading...</div>
    <div id="tilt-controls" aria-label="Tilt view">
      <button id="tilt-up" aria-label="Tilt view up">&#9650;</button>
      <button id="tilt-left" aria-label="Tilt view left">&#9664;</button>
      <button id="tilt-right" aria-label="Tilt view right">&#9654;</button>
      <button id="tilt-down" aria-label="Tilt view down">&#9660;</button>
    </div>
    <div id="zoom-controls" aria-label="Zoom">
      <span aria-hidden="true">&#8722;</span>
      <input type="range" id="zoom-bar" aria-label="Zoom level" />
      <span aria-hidden="true">&#43;</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
